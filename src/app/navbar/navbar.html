<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/" class="brand-link">
      <span class="logo-arabic">وَرَق</span>
      <span class="logo-text">Waraq</span>
    </a>
  </div>

  <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
    <span></span><span></span><span></span>
  </button>

  <ul class="navbar-links" [class.mobile-open]="menuOpen">
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuOpen=false">Home</a></li>
    <li><a routerLink="/books" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" (click)="menuOpen=false">Books</a></li>
    @if (isLoggedIn$ | async) {
    <li><a routerLink="/my-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" (click)="menuOpen=false">My Orders</a></li>
    <li><a routerLink="/cart" routerLinkActive="active" (click)="menuOpen=false">Cart</a></li>
    }
    @if (isAdmin$ | async) {
    <li><a routerLink="/admin" routerLinkActive="active" (click)="menuOpen=false">Admin</a></li>
    }
  </ul>

  <div class="navbar-actions">
    @if (isLoggedIn$ | async) {
    <a class="cart-icon" routerLink="/cart" aria-label="Cart">
      🛒
      @if (cartService.itemCount(); as count) {
      <span class="cart-badge">{{ count }}</span>
      }
    </a>
    }

    @if (user$ | async; as user) {
    <div class="user-menu">
      <span class="user-name">{{ user.name }}</span>
      <button class="btn-signin" (click)="logout()">Logout</button>
    </div>
    } @else {
    <a routerLink="/login">
      <button class="btn-signin">Sign In</button>
    </a>
    }
  </div>
</nav>
