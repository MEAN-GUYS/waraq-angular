<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/" class="brand-link">
      <span class="logo-arabic">وَرَق</span>
      <span class="logo-text">Waraq</span>
    </a>
  </div>

  <ul class="navbar-links">
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
    <li><a routerLink="/books" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">Books</a></li>
    @if (isLoggedIn$ | async) {
    <li><a routerLink="/my-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">My Orders</a></li>
    <li><a routerLink="/cart" routerLinkActive="active">Cart</a></li>
    }
  </ul>

  <div class="navbar-actions">
    @if (isLoggedIn$ | async) {
    <a class="cart-icon" routerLink="/cart" aria-label="Cart">
      🛒
      @if (cartCount$ | async; as count) {
      <span class="cart-badge">{{ count }}</span>
      }
    </a>
    }

    @if (user$ | async; as user) {
    <div class="user-menu">
      <span class="user-name">{{ user.name }}</span>
      <button class="btn-signin" (click)="logout()">Logout</button>
    </div>
    } @else {
    <a routerLink="/login">
      <button class="btn-signin">Sign In</button>
    </a>
    }
  </div>
</nav>
