<div class="rounded-xl shadow-md flex flex-col w-48 overflow-hidden border border-amber-100">
  <div class="flex items-center justify-center h-44 bg-amber-50 p-4">
    <img [src]="book().cover" class="h-32 object-contain" />
  </div>
  <div class="flex flex-col gap-1 p-3 bg-white">
    <h2 class="text-gray-800 font-bold text-sm">{{book().name}}</h2>
    <p class="text-gray-400 text-xs">{{book().name}}</p>
    <div class="flex justify-end mt-2">
      <span class="font-bold text-amber-700 text-base">${{book().price}}</span>
    </div>
  </div>
</div>
