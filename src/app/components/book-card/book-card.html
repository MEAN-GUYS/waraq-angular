<a [routerLink]="['/books', book().id]" class="rounded-xl shadow-md flex flex-col w-56 overflow-hidden border border-amber-100 bg-white cursor-pointer">
  <div class="flex items-center justify-center h-56 bg-amber-50 p-4 shrink-0">
    <img [src]="book().cover" [alt]="book().name" class="h-44 w-auto object-contain" />
  </div>
  <div class="flex flex-col p-4">
    <h2 class="text-gray-800 font-bold text-xl leading-6 h-12 overflow-hidden">{{ book().name }}</h2>
    <p class="text-gray-400 text-sm leading-6 h-20 overflow-hidden mt-2">{{ book().description }}</p>
    <div class="flex justify-end mt-4">
      <span class="font-bold text-amber-700 text-base">${{ book().price }}</span>
    </div>
  </div>
</a>
