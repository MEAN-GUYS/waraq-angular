<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-amber-50 to-amber-100 p-4">

  <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-amber-600 mb-2">وَرَق</h1>
      <h2 class="text-xl font-semibold text-gray-800">Welcome Back</h2>
      <p class="text-sm text-gray-500">Sign in to your account</p>
    </div>

    <!-- Error Message -->
    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-600 text-sm text-center">{{ errorMessage }}</p>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 focus:outline-none"
          placeholder="you@example.com"
        >

        @if (submitted && f['email'].errors) {
          <p class="text-red-500 text-xs mt-1">
            Please enter a valid email
          </p>
        }
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-400 focus:outline-none"
          placeholder="••••••••"
        >

        @if (submitted && f['password'].errors) {
          <p class="text-red-500 text-xs mt-1">
            Password is required
          </p>
        }
      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-amber-500 hover:bg-amber-600 disabled:opacity-60 text-white font-semibold py-2.5 rounded-lg transition duration-200 cursor-pointer"
      >
        @if (loading) {
          <span class="inline-flex items-center gap-2">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Signing in…
          </span>
        } @else {
          Sign In
        }
      </button>

    </form>

    <!-- Link to Register -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a routerLink="/register" class="text-amber-600 font-semibold hover:underline cursor-pointer">
        Create Account
      </a>
    </p>

  </div>
</div>
