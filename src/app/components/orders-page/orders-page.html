<div class="orders-page">
  <div class="orders-header">
    <h2 class="orders-title">My Orders</h2>
    <p class="orders-subtitle">{{ orders.length }} orders placed</p>
  </div>

  <div *ngIf="isLoading" class="loading">Loading your orders...</div>

  <div class="orders-list" *ngIf="!isLoading">
    <div class="order-card" *ngFor="let order of orders">

      <div class="order-header" (click)="toggleOrder(order.id)">
        <div class="order-meta">
          <span class="order-id">{{ order.id }}</span>
          <span class="order-date">{{ order.createdAt | date:'MMM d, y' }}</span>
        </div>
        <div class="order-right">
          <span class="order-total">${{ order.totalPrice.toFixed(2) }}</span>
          <span class="status-badge" [ngClass]="getStatusClass(order.shippingStatus)">
            {{ order.shippingStatus }}
          </span>
          <span class="chevron" [class.open]="expandedOrder === order.id">›</span>
        </div>
      </div>

      <div class="order-body" [class.expanded]="expandedOrder === order.id">

        <div class="progress-track">
          <div class="progress-step"
               *ngFor="let step of ['processing', 'out for delivery', 'delivered']; let i = index"
               [class.active]="getStatusStep(order.shippingStatus) > i"
               [class.current]="getStatusStep(order.shippingStatus) === i + 1">
            <div class="step-dot"></div>
            <span class="step-label">{{ step }}</span>
          </div>
          <div class="progress-line">
            <div class="progress-fill" [style.width.%]="(getStatusStep(order.shippingStatus) - 1) * 50"></div>
          </div>
        </div>

        <div class="order-items">
          <div class="order-item" *ngFor="let item of order.items">
            <div class="item-left">
              <img [src]="item.cover" alt="cover" class="item-cover" *ngIf="item.cover" />
              <div class="item-cover" *ngIf="!item.cover">📕</div>
              <div class="item-info">
                <h4>{{ item.name }}</h4>
                <span class="item-qty">Qty: {{ item.quantity }}</span>
              </div>
            </div>
            <div class="item-right">
              <span class="item-price">${{ (item.price * item.quantity).toFixed(2) }}</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
